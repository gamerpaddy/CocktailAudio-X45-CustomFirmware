# MPD on the X45 - production configuration TEMPLATE.
#
# deploy/x45stack copies this to /home/root/x45new/mpd/mpd.conf at start,
# replacing @MUSIC_DIR@ with the disk if it is mounted and with the built-in
# test folder if not (MPD refuses to start when its music directory is missing,
# and the NTFS disk is only mounted some way into boot).
#
# Everything lives under /home/root/x45new, the parallel userspace; nothing in
# the vendor rootfs is touched.

music_directory     "@MUSIC_DIR@"
playlist_directory  "/home/root/x45new/mpd/playlists"
db_file             "/home/root/x45new/mpd/database"
state_file          "/home/root/x45new/mpd/state"
pid_file            "/home/root/x45new/mpd/pid"
log_file            "/home/root/x45new/mpd/log"

# The standard MPD port, on every interface, so any MPD client on the network
# (phone apps, ncmpcpp, ...) can drive the unit. There is no access control: anyone on
# the LAN can control playback. Set `password "secret@read,add,control,admin"`
# and bind to a single address here if that is not acceptable.
bind_to_address     "0.0.0.0"
port                "6600"

auto_update         "yes"
restore_paused      "yes"

# The XMOS USB bridge, addressed by its card ID (never by index: power-cycling
# the audio board re-enumerates it and the card number moves).
#
# Bit-perfect means MPD must not touch the samples: no resampling, no format
# conversion, no channel remap, and no software mixer. Volume is the analog
# stage: the hardware mixer below is the board's own `Master` control on the
# x45audio card, a raw 0-100 integer that drives the SRC4392 and ES9018 volume
# registers through the vendor driver. Samples are never scaled.
audio_output {
	type            "alsa"
	name            "XMOS"
	device          "hw:CocktailAudio,0"
	mixer_type      "hardware"
	mixer_device    "hw:x45audio"
	mixer_control   "Master"
	auto_resample   "no"
	auto_format     "no"
	auto_channels   "no"
	dop             "no"
}

# The default 4 MiB buffer is plenty for local files and we have ~100 MB free.
audio_buffer_size   "8192"
