# upmpdcli: UPnP/DLNA renderer in front of MPD. Phones and PCs ("Cast to device",
# BubbleUPnP, ...) see "Cocktail Audio X45" and play into the same MPD queue and
# the same bit-perfect output as everything else.
pkgdatadir = /home/root/x45new/share/upmpdcli
friendlyname = Cocktail Audio X45
mpdhost = 127.0.0.1
mpdport = 6600
upnpav = 1
openhome = 0
cachedir = /tmp/upmpdcli
logfilename = /tmp/upmpdcli.log
loglevel = 2
iconpath = /home/root/x45new/share/upmpdcli/icon.png
presentationhtml = /home/root/x45new/share/upmpdcli/presentation.html
