// AirPlay receiver for the X45 (shairport-sync 4.3, classic AirPlay).
//
// Started and supervised by deploy/x45stack; the hooks in sessioncontrol keep it
// from fighting MPD for the single DAC.

general =
{
	name = "Cocktail Audio X45";
	output_backend = "alsa";
	mdns_backend = "tinysvcmdns";
	port = 5000;

	// The front-panel knob is the volume. If AirPlay's own volume were applied
	// it would scale the samples in software and throw away bit depth; ignoring
	// it keeps the stream untouched and the knob in charge.
	ignore_volume_control = "yes";

	// The device has to stay quiet when nothing is streaming.
	statistics = "no";
	log_verbosity = 0;
};

alsa =
{
	// By card ID, never by index: power-cycling the audio board re-enumerates
	// the XMOS and the number moves.
	output_device = "hw:CocktailAudio,0";

	// AirPlay is 44.1 kHz / 16 bit. The XMOS takes that natively.
	output_rate = 44100;
	output_format = "S16";

	use_mmap_if_available = "no";
};

sessioncontrol =
{
	// Release the DAC and pick the right clock family before audio starts.
	run_this_before_play_begins = "/home/root/x45new/bin/x45-airplay-begin";
	run_this_after_play_ends = "/home/root/x45new/bin/x45-airplay-end";
	wait_for_completion = "yes";

	// A second device may take over from the first rather than being refused.
	allow_session_interruption = "yes";
	session_timeout = 20;
};
